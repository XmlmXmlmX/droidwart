# Portainer stack "droidwart"
services:
  adb-server:
    image: ghcr.io/xmlmxmlmx/droidwart-adb-server:${DROIDWART_TAG:-edge}
    environment:
      - ADB_CONNECT=192.168.178.164:5555,192.168.178.160:5555
      - ADB_RECONNECT_INTERVAL=60
    volumes:
      - adb-keys:/home/adb/.android
    # Port 5037 is intentionally not published: only Droidwart talks to the ADB server.
    # If Home Assistant's ADB integration should use it later, publish "5037:5037"
    # and restrict it to 192.168.178.157 via the Proxmox firewall (no authentication!).
    restart: unless-stopped

  droidwart:
    image: ghcr.io/xmlmxmlmx/droidwart:${DROIDWART_TAG:-edge}
    depends_on: [adb-server]
    environment:
      - Adb__ServerHost=adb-server
      - Adb__ServerPort=5037
      - Mqtt__Host=192.168.178.157
      - Mqtt__Port=1883
      - Mqtt__Username=droidwart-mqtt
      - Mqtt__Password=${MQTT_PASSWORD:?Set MQTT_PASSWORD in the stack environment}
      # from phase 5:
      - Frigate__BaseUrl=http://192.168.178.11:5000
      # optional, raises the GitHub rate limit (read-only access is enough):
      - GitHub__Token=${GITHUB_TOKEN:-}
    volumes:
      - droidwart-data:/data
    restart: unless-stopped

volumes:
  adb-keys:
  droidwart-data:
