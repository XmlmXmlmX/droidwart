# Portainer stack "droidwart"
services:
  adb-server:
    image: ghcr.io/xmlmxmlmx/droidwart-adb-server:1.0.0
    environment:
      - ADB_CONNECT=192.168.178.164:5555,192.168.178.160:5555
      - ADB_RECONNECT_INTERVAL=60
    volumes:
      - adb-keys:/home/adb/.android
    ports:
      # Only needed if Home Assistant uses the ADB integration in "ADB server" mode.
      # No authentication: restrict to 192.168.178.157 via the Proxmox firewall.
      - "5037:5037"
    restart: unless-stopped

  droidwart:
    image: ghcr.io/xmlmxmlmx/droidwart:1.0.0
    depends_on: [adb-server]
    environment:
      - Adb__ServerHost=adb-server
      - Adb__ServerPort=5037
      # from phase 3:
      - Mqtt__Host=192.168.178.157
      - Mqtt__Port=1883
      - Mqtt__Username=droidwart
      - Mqtt__Password=${MQTT_PASSWORD}
      # from phase 5:
      - Frigate__BaseUrl=http://192.168.178.11:5000
      # from phase 2 (optional, read-only access):
      - GitHub__Token=${GITHUB_TOKEN:-}
    volumes:
      - droidwart-data:/data
    restart: unless-stopped

volumes:
  adb-keys:
  droidwart-data:
