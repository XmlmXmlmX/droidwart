name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Run tests
        run: dotnet test Droidwart.slnx --configuration Release
      - name: Build Droidwart image
        run: docker build --file Dockerfile --tag droidwart:ci .
      - name: Build ADB server image
        run: docker build --file docker/adb-server/Dockerfile --tag droidwart-adb-server:ci docker/adb-server

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Droidwart image metadata
        id: droidwart-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xmlmxmlmx/droidwart
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - name: Build and push Droidwart image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.droidwart-meta.outputs.tags }}
          labels: ${{ steps.droidwart-meta.outputs.labels }}
      - name: Extract ADB server image metadata
        id: adb-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xmlmxmlmx/droidwart-adb-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - name: Build and push ADB server image
        uses: docker/build-push-action@v6
        with:
          context: docker/adb-server
          file: docker/adb-server/Dockerfile
          push: true
          tags: ${{ steps.adb-meta.outputs.tags }}
          labels: ${{ steps.adb-meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
